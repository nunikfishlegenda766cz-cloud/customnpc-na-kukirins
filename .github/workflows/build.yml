name: Build JAR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: mvn clean package
      - uses: actions/upload-artifact@v4
        with:
          name: CustomNPC-plugin
          path: target/CustomNPC-1.0.jar
